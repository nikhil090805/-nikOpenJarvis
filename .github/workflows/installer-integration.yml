name: Installer integration

on:
  pull_request:
    paths:
      - 'scripts/install/**'
      - 'deploy/windows/**'
      - 'deploy/docker/**'
      - 'rust/**'
      - 'frontend/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'src/openjarvis/cli/**'
      - 'tests/install/**'
      - '.github/workflows/installer-integration.yml'
  schedule:
    - cron: '0 6 * * *'

jobs:
  container-matrix:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - ubuntu:22.04
          - ubuntu:24.04
          - fedora:40

    container: ${{ matrix.image }}

    steps:
      - name: Install prereqs (Ubuntu/Debian)
        if: contains(matrix.image, 'ubuntu') || contains(matrix.image, 'debian')
        run: |
          apt-get update
          apt-get install -y curl git python3 sudo

      - name: Install prereqs (Fedora)
        if: contains(matrix.image, 'fedora')
        run: |
          dnf install -y curl git python3 sudo

      - name: Create non-root user
        run: useradd -m -s /bin/bash testuser

      - uses: actions/checkout@v7
        with:
          path: openjarvis-src

      - name: Install Ollama mock
        run: install -m 755 "$GITHUB_WORKSPACE/openjarvis-src/tests/install/bash/stubs/ollama-mock" /usr/local/bin/ollama

      - name: Run installer
        run: |
          chown -R testuser:testuser /home/testuser "$GITHUB_WORKSPACE/openjarvis-src"
          su testuser -c '
            export OPENJARVIS_REPO_URL=file://'"$GITHUB_WORKSPACE"'/openjarvis-src
            cd '"$GITHUB_WORKSPACE"'/openjarvis-src
            bash scripts/install/install.sh --no-bg-orchestrator
          '

      - name: Verify install state
        run: |
          su testuser -c '
            test -d ~/.openjarvis/src
            test -d ~/.openjarvis/.venv
            test -f ~/.openjarvis/config.toml
            test -f ~/.openjarvis/.state/install-state.json
            test -L ~/.local/bin/jarvis
          '

      - name: Verify jarvis --version
        run: su testuser -c '~/.local/bin/jarvis --version'

      - name: Verify jarvis doctor exits 0
        run: su testuser -c '~/.local/bin/jarvis doctor'

      - name: Verify uninstall is clean
        run: |
          su testuser -c '
            ~/.local/bin/jarvis-uninstall --yes
            test ! -d ~/.openjarvis
            test ! -L ~/.local/bin/jarvis
          '

  macos:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS 14 runners retired on November 2, 2026. Keep coverage of
        # both Intel and Apple Silicon on supported macOS 15 images.
        os: [macos-15-intel, macos-15]

    steps:
      - uses: actions/checkout@v7

      - name: Install Ollama mock
        run: sudo install -m 755 tests/install/bash/stubs/ollama-mock /usr/local/bin/ollama

      - name: Run installer
        run: |
          export OPENJARVIS_REPO_URL=file://$(pwd)
          bash scripts/install/install.sh --no-bg-orchestrator

      - name: Verify install state
        run: |
          test -d ~/.openjarvis/src
          test -d ~/.openjarvis/.venv
          test -f ~/.openjarvis/config.toml
          test -L ~/.local/bin/jarvis

      - name: Verify jarvis --version
        run: ~/.local/bin/jarvis --version

      - name: Verify jarvis doctor exits 0
        run: ~/.local/bin/jarvis doctor

      - name: Verify uninstall is clean
        run: |
          ~/.local/bin/jarvis-uninstall --yes
          test ! -d ~/.openjarvis
          test ! -L ~/.local/bin/jarvis

  # Native Windows x64 coverage. Steps labelled MOCKED use command stubs and
  # never install third-party software or register a real scheduled task.
  # Steps labelled REAL are true integration checks on the Windows runner.
  windows-x64:
    name: Windows x64 (REAL build + MOCKED installer checks)
    runs-on: windows-latest
    env:
      RUSTUP_AUTO_INSTALL: "0"
      RUSTUP_TOOLCHAIN: "1.90.0"
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Use the reviewed npm toolchain
        run: npm install --global npm@11.19.0

      - name: REAL Rustup detection + Rust 1.90.0 minimal + MSVC target
        shell: bash
        run: |
          rustup --version
          rustup toolchain install 1.90.0 --profile minimal --no-self-update
          rustup default 1.90.0
          rustup target add --toolchain 1.90.0 x86_64-pc-windows-msvc
          rustc --version
          rustup show active-toolchain
          rustup target list --installed --toolchain 1.90.0
          rustup component list --installed --toolchain 1.90.0

      - name: REAL MSVC linker / Windows SDK detection
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) { throw 'vswhere.exe not found on this runner' }
          $linker = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC\Tools\MSVC\**\bin\Host*\*\link.exe'
          if (-not $linker) { throw 'MSVC link.exe not found on this runner' }
          Write-Host "MSVC linker: $linker"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: MOCKED installer/service checks (PowerShell syntax, Rust stage, repo selection, failed download, argument validation)
        shell: pwsh
        run: |
          ./tests/install/windows/Assert-WindowsInstaller.ps1 -RepoRoot (Get-Location).Path

      - name: MOCKED Ollama prerequisite handling (stub on PATH, no download)
        shell: pwsh
        run: |
          $stub = Join-Path $env:RUNNER_TEMP 'oj-ollama-stub'
          New-Item -ItemType Directory -Path $stub -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $stub 'ollama.cmd') -Value "@echo off`r`nexit /b 0" -Encoding ASCII
          $found = Get-Command ollama -ErrorAction SilentlyContinue
          Write-Host "Pre-stub ollama: $found"
          # The installer's Get-Command check is what the harness exercises;
          # no real Ollama binary is installed or started in CI.
          if (-not (Test-Path (Join-Path $stub 'ollama.cmd'))) { throw 'stub missing' }

      - name: REAL uv dependency install + native extension compile/import + idempotency
        shell: bash
        run: |
          uv sync --locked --extra desktop --group desktop-native
          uv run python -c "import openjarvis_rust; print('openjarvis_rust import OK')"
          uv sync --locked --extra desktop --group desktop-native
          uv run python -c "import openjarvis_rust"

      - name: REAL install.ps1 end-to-end, twice (idempotency; real Ollama install)
        shell: pwsh
        env:
          OPENJARVIS_HOME: ${{ runner.temp }}\OpenJarvis
          OPENJARVIS_REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          $ErrorActionPreference = 'Stop'
          # This runs the REAL installer, not a copy of its logic, and it does
          # NOT stub Ollama: install.ps1 refreshes PATH from the registry, so a
          # PATH-only stub is discarded and the installer takes its real
          # winget/direct-download branch and pulls the starter model. The
          # second run must then find Ollama and the model already present,
          # which is exactly the idempotency asserted below. Only the Windows
          # service/task is skipped (-SkipService).

          $installer = Join-Path (Get-Location).Path 'deploy\windows\install.ps1'
          $sourceDir = (Get-Location).Path

          Write-Host '=== install.ps1: first run (REAL) ==='
          $first = & $installer -SourceDir $sourceDir -SkipService *>&1 | Out-String
          Write-Host $first
          if ($first -notmatch 'openjarvis_rust extension imports successfully') {
            throw 'First installer run did not build and import the native extension'
          }
          if ($first -notmatch 'Rust 1\.90\.0') {
            throw 'First installer run did not report the pinned Rust 1.90.0 toolchain'
          }
          $shim = Join-Path $env:OPENJARVIS_HOME 'bin\jarvis.cmd'
          if (-not (Test-Path $shim)) { throw "Installer did not create $shim" }

          Write-Host '=== install.ps1: second run (idempotency) ==='
          $second = & $installer -SourceDir $sourceDir -SkipService *>&1 | Out-String
          Write-Host $second
          if ($second -notmatch 'already healthy') {
            throw 'Second run did not reuse the installed Rust toolchain'
          }
          if ($second -match 'toolchain install') {
            throw 'Second run re-downloaded the Rust toolchain (not idempotent)'
          }
          if ($second -notmatch 'openjarvis_rust extension imports successfully') {
            throw 'Second run did not verify the native extension'
          }

          # The installed tree must actually work: the shim resolves the
          # project and the native extension from the real install location.
          & uv run --project $sourceDir python -c "import openjarvis_rust; print('post-install openjarvis_rust import OK')"

      - name: REAL Python installer/toolchain regression tests
        shell: bash
        run: |
          # REAL Python regression tests + MOCKED PowerShell prerequisite
          # helpers (Get-PythonCommand / Test-MsvcLinker) and clone-branch tests.
          # install.ps1 just re-synced this workspace venv with the desktop
          # extras, which drops the dev group, so restore the test extras first.
          uv sync --locked --extra dev --extra server
          uv run pytest \
            tests/install/test_windows_remediation.py \
            tests/install/test_windows_prerequisites.py \
            tests/install/test_version_history.py \
            tests/install/test_quickstart_prerequisites.py \
            tests/deployment/test_docker.py -q

      - name: REAL frontend dependency install + tests + production build
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

      - name: REAL Tauri Windows x64 desktop build
        working-directory: frontend
        run: npx tauri build --bundles nsis

      - name: REAL NSIS installer artifact check + upload
        shell: pwsh
        run: |
          $bundle = 'frontend\src-tauri\target\release\bundle\nsis'
          if (-not (Test-Path $bundle)) { throw "NSIS bundle directory missing: $bundle" }
          $setups = @(Get-ChildItem -LiteralPath $bundle -Filter '*setup.exe' -File)
          if ($setups.Count -ne 1) {
            throw "Expected exactly one NSIS setup.exe in $bundle, found $($setups.Count)"
          }
          $app = 'frontend\src-tauri\target\release\openjarvis-desktop.exe'
          if (-not (Test-Path $app)) { throw "Desktop executable missing: $app" }
          $setup = $setups[0]
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $setup.FullName).Hash
          Write-Host "NSIS installer: $($setup.FullName)"
          Write-Host "Size: $([math]::Round($setup.Length / 1MB, 2)) MiB"
          Write-Host "SHA-256: $hash"
          "NSIS installer: $($setup.Name) ($([math]::Round($setup.Length / 1MB, 2)) MiB)`nSHA-256: $hash" |
            Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'nsis-sha256.txt') -Encoding ASCII
          "OPENJARVIS_NSIS_PATH=$($setup.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/upload-artifact@v7
        with:
          name: OpenJarvis-Windows-x64-NSIS
          path: |
            frontend/src-tauri/target/release/bundle/nsis/*.exe
            frontend/src-tauri/target/release/openjarvis-desktop.exe
          if-no-files-found: error
          retention-days: 14

      - name: REAL backend startup and /health check (Ollama HTTP API mocked)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Only the external model provider is mocked: a tiny HTTP server that
          # answers Ollama's /api/tags, so the REAL backend, REAL engine
          # discovery and REAL /health route are what gets exercised. No model
          # is downloaded and ollama.com is never contacted.
          $stub = Join-Path $env:RUNNER_TEMP 'fake_ollama.py'
          @'
          import json
          from http.server import BaseHTTPRequestHandler, HTTPServer


          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  body = json.dumps({"models": [{"name": "qwen3.5:2b"}]}).encode()
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              def log_message(self, *args):
                  pass


          HTTPServer(("127.0.0.1", 11434), Handler).serve_forever()
          '@ | Set-Content -LiteralPath $stub -Encoding utf8

          $stubProc = Start-Process -FilePath 'python' -ArgumentList @($stub) -PassThru -WindowStyle Hidden
          $outLog = Join-Path $env:RUNNER_TEMP 'openjarvis-serve.log'
          $errLog = Join-Path $env:RUNNER_TEMP 'openjarvis-serve.err.log'
          $serveProc = Start-Process -FilePath 'uv' `
            -ArgumentList @('run', 'jarvis', 'serve', '--host', '127.0.0.1', '--port', '8000') `
            -PassThru -WindowStyle Hidden -RedirectStandardOutput $outLog -RedirectStandardError $errLog
          try {
              $healthy = $false
              $content = ''
              for ($i = 0; $i -lt 60; $i++) {
                  try {
                      $response = Invoke-WebRequest -Uri 'http://127.0.0.1:8000/health' `
                        -UseBasicParsing -TimeoutSec 5
                      $content = $response.Content
                      if ($response.StatusCode -eq 200 -and $content -match '"status"\s*:\s*"ok"') {
                          $healthy = $true
                          break
                      }
                  } catch {
                      if ($serveProc.HasExited) { break }
                  }
                  Start-Sleep -Seconds 2
              }
              if (-not $healthy) {
                  Write-Host '--- jarvis serve stdout ---'
                  Get-Content -LiteralPath $outLog -ErrorAction SilentlyContinue
                  Write-Host '--- jarvis serve stderr ---'
                  Get-Content -LiteralPath $errLog -ErrorAction SilentlyContinue
                  throw 'Backend /health did not return 200 with status ok'
              }
              Write-Host "Backend /health OK: $content"
          } finally {
              foreach ($proc in @($serveProc, $stubProc)) {
                  if ($proc -and -not $proc.HasExited) {
                      & taskkill /T /F /PID $proc.Id | Out-Null
                  }
              }
          }
